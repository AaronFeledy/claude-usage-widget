name: Release

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  version:
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.bump.outputs.new_tag }}
      new_version: ${{ steps.bump.outputs.new_version }}
      changelog: ${{ steps.bump.outputs.changelog }}
      skipped: ${{ steps.bump.outputs.skipped }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: bump
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main

  build-branch:
    needs: version
    if: needs.version.outputs.skipped != 'true'
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - runtime: win-x64
            goarch: amd64
          - runtime: win-arm64
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Update version in csproj
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.new_version }}"
          (Get-Content clients/windows/ClaudeUsageWidget.csproj) -replace '<Version>.*</Version>', "<Version>$version</Version>" | Set-Content clients/windows/ClaudeUsageWidget.csproj
      - name: Publish
        run: dotnet publish clients/windows/ClaudeUsageWidget.csproj -c Release -r ${{ matrix.runtime }} -p:PublishSingleFile=true -p:SelfContained=true -p:EnableCompressionInSingleFile=true
      - run: mv clients/windows/bin/Release/net8.0-windows/${{ matrix.runtime }}/publish/ClaudeUsageWidget.exe ClaudeUsageWidget-${{ matrix.runtime }}.exe
      - name: Build usage server
        shell: pwsh
        working-directory: server
        run: |
          $env:GOOS = 'windows'
          $env:GOARCH = '${{ matrix.goarch }}'
          go build -trimpath -ldflags "-s -w" -o ../usage-server-${{ matrix.runtime }}.exe ./cmd/usage-server
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeUsageWidget-${{ matrix.runtime }}
          path: |
            ClaudeUsageWidget-${{ matrix.runtime }}.exe
            usage-server-${{ matrix.runtime }}.exe

  release-branch:
    needs: [version, build-branch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.new_tag }}
          name: ${{ needs.version.outputs.new_tag }}
          body: ${{ needs.version.outputs.changelog }}
          files: artifacts/**/*.exe

  build-tag:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - runtime: win-x64
            goarch: amd64
          - runtime: win-arm64
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Update version in csproj
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          (Get-Content clients/windows/ClaudeUsageWidget.csproj) -replace '<Version>.*</Version>', "<Version>$version</Version>" | Set-Content clients/windows/ClaudeUsageWidget.csproj
      - name: Publish
        run: dotnet publish clients/windows/ClaudeUsageWidget.csproj -c Release -r ${{ matrix.runtime }} -p:PublishSingleFile=true -p:SelfContained=true -p:EnableCompressionInSingleFile=true
      - run: mv clients/windows/bin/Release/net8.0-windows/${{ matrix.runtime }}/publish/ClaudeUsageWidget.exe ClaudeUsageWidget-${{ matrix.runtime }}.exe
      - name: Build usage server
        shell: pwsh
        working-directory: server
        run: |
          $env:GOOS = 'windows'
          $env:GOARCH = '${{ matrix.goarch }}'
          go build -trimpath -ldflags "-s -w" -o ../usage-server-${{ matrix.runtime }}.exe ./cmd/usage-server
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeUsageWidget-${{ matrix.runtime }}
          path: |
            ClaudeUsageWidget-${{ matrix.runtime }}.exe
            usage-server-${{ matrix.runtime }}.exe

  release-tag:
    needs: build-tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: artifacts/**/*.exe
