name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ startsWith(github.ref, 'refs/heads/') && 'main' || github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.reuse.outputs.version || steps.branch.outputs.version }}
      tag: ${{ steps.reuse.outputs.tag || steps.branch.outputs.tag }}
      changelog: ${{ steps.reuse.outputs.changelog || steps.bump.outputs.changelog }}
    steps:
      - name: Require the main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Reuse a release tag already created for this main commit
        id: reuse
        run: python3 packaging/release_tag.py --commit "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Resolve the next main-branch tag
        id: bump
        if: steps.reuse.outputs.reused != 'true'
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main
          dry_run: true
      - name: Validate generated tag and version
        id: branch
        if: steps.reuse.outputs.reused != 'true'
        env:
          NEW_TAG: ${{ steps.bump.outputs.new_tag }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          test -n "$NEW_TAG" && test "$NEW_TAG" = "v$NEW_VERSION"
          python3 packaging/validate_version.py "$NEW_VERSION" --github-output "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$NEW_TAG" >> "$GITHUB_OUTPUT"
  packages:
    needs: resolve
    if: needs.resolve.outputs.version != ''
    uses: ./.github/workflows/headroom-packages.yml
    with:
      version: ${{ needs.resolve.outputs.version }}

  publish:
    needs: [resolve, packages]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create or verify the release tag at this commit
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_CHANGELOG: ${{ needs.resolve.outputs.changelog }}
        run: |
          expected=$(git rev-parse "$EXPECTED_SHA^{commit}")
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" || true
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$expected"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            printf '%s\n' "${RELEASE_CHANGELOG:-Headroom $RELEASE_TAG}" > "$RUNNER_TEMP/headroom-tag-message"
            git tag -a "$RELEASE_TAG" "$expected" -F "$RUNNER_TEMP/headroom-tag-message"
            if ! git push origin "refs/tags/$RELEASE_TAG"; then
              git tag -d "$RELEASE_TAG"
              git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
              test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$expected"
            fi
          fi
      - uses: actions/download-artifact@v8
        with:
          name: headroom-release-assets
          path: artifacts
      - name: Publish one verified Headroom release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: ${{ needs.resolve.outputs.tag }}
          body: ${{ needs.resolve.outputs.changelog }}
          files: artifacts/*
          fail_on_unmatched_files: true
